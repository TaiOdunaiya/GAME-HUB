<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME-HUB | Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kenia&family=Mukta:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
      .auth-page {
        min-height: calc(100vh - 19rem - 5rem);
        background: #1e0772;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 2rem;
      }
      .auth-card {
        background: #fff;
        border-radius: 2rem;
        padding: 5rem;
        width: 100%;
        max-width: 50rem;
        box-shadow: 0 3rem 8rem rgba(0,0,0,0.3);
      }
      .auth-logo {
        text-align: center;
        margin-bottom: 3rem;
      }
      .auth-logo i {
        font-size: 5rem;
        color: #2848ff;
      }
      .auth-logo span {
        display: block;
        font-family: 'Kenia', cursive;
        font-size: 3rem;
        color: #1e0772;
        letter-spacing: 0.3rem;
        margin-top: 0.5rem;
      }
      .tab-row {
        display: flex;
        border-bottom: 0.2rem solid #eee;
        margin-bottom: 3rem;
      }
      .auth-tab {
        flex: 1;
        text-align: center;
        padding: 1.2rem;
        font-size: 1.7rem;
        color: #888;
        cursor: pointer;
        border-bottom: 0.3rem solid transparent;
        margin-bottom: -0.2rem;
        transition: all 0.2s;
        font-family: 'Mukta', sans-serif;
        background: none;
        border-left: none;
        border-right: none;
        border-top: none;
        letter-spacing: 0.1rem;
      }
      .auth-tab.active {
        color: #2848ff;
        border-bottom-color: #2848ff;
        font-weight: 700;
      }
      .auth-panel {
        display: none;
      }
      .auth-panel.active {
        display: block;
      }
      .auth-name-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      .auth-form-group {
        margin-bottom: 2rem;
      }
      .auth-form-group label {
        display: block;
        font-size: 1.5rem;
        color: #1e0772;
        margin-bottom: 0.7rem;
      }
      .auth-input-wrap {
        position: relative;
      }
      .auth-input-wrap i {
        position: absolute;
        left: 1.5rem;
        top: 50%;
        transform: translateY(-50%);
        color: #aaa;
        font-size: 1.6rem;
      }
      .auth-form-group input {
        width: 100%;
        padding: 1.2rem 1.5rem 1.2rem 4.5rem;
        border: 0.1rem solid #e0e0e0;
        border-radius: 0.8rem;
        font-size: 1.6rem;
        color: #1e0772;
        font-family: 'Mukta', sans-serif;
        transition: border 0.2s;
      }
      .auth-form-group input:focus {
        border-color: #2848ff;
      }
      .forgot-link {
        display: block;
        text-align: right;
        font-size: 1.4rem;
        color: #2848ff;
        text-decoration: none;
        margin-top: 0.5rem;
      }
      .forgot-link:hover {
        text-decoration: underline;
      }
      .auth-btn {
        width: 100%;
        padding: 1.5rem;
        background: #2848ff;
        color: #fff;
        border: none;
        border-radius: 3rem;
        font-size: 1.8rem;
        cursor: pointer;
        font-family: 'Mukta', sans-serif;
        transition: all 0.3s;
        letter-spacing: 0.1rem;
        margin-top: 1rem;
      }
      .auth-btn:hover {
        background: #1e0772;
      }
      .auth-divider {
        text-align: center;
        font-size: 1.5rem;
        color: #aaa;
        margin: 2rem 0;
        position: relative;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 0.1rem;
        background: #eee;
      }
      .auth-divider::before { left: 0; }
      .auth-divider::after { right: 0; }
      .social-btn {
        width: 100%;
        padding: 1.2rem;
        border: 0.1rem solid #e0e0e0;
        border-radius: 3rem;
        font-size: 1.6rem;
        cursor: pointer;
        font-family: 'Mukta', sans-serif;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #fff;
        color: #333;
        margin-bottom: 1rem;
      }
      .social-btn:hover {
        background: #f7f7f7;
      }
      .auth-footer-text {
        text-align: center;
        font-size: 1.5rem;
        color: #888;
        margin-top: 2rem;
      }
      .auth-footer-text a {
        color: #2848ff;
        text-decoration: none;
      }
      .auth-footer-text a:hover {
        text-decoration: underline;
      }
      @media (max-width: 600px) {
        .auth-card { padding: 3rem 2rem; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="navbar-top">
          <a href="index.html" class="logo">
            <i class="fa-solid fa-gamepad"></i>
            <span>GAME-HUB</span>
          </a>
          <div class="search-bar">
            <input type="text" placeholder="What are you looking for?" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <div class="user">
            <a href="cart.html" class="cart-link">
              <i class="fa-solid fa-cart-shopping"></i>
              <span>$0.00</span>
            </a>
            <a href="wishlist.html"><i class="fa-regular fa-heart"></i></a>
            <a href="login.html" style="color:#2848ff;"><i class="fa-solid fa-user"></i></a>
          </div>
        </div>
        <div class="nav-list">
          <a href="index.html">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
          </a>
          <a href="products.html">
            <i class="fa-solid fa-gamepad"></i>
            <span>PRODUCTS</span>
          </a>
          <a href="index.html#pricing">
            <i class="fa-solid fa-dollar-sign"></i>
            <span>PRICING</span>
          </a>
          <a href="blog.html">
            <i class="fa-brands fa-blogger"></i>
            <span>BLOG</span>
          </a>
          <a href="sales.html">
            <i class="fa-solid fa-star"></i>
            <span>SALES</span>
          </a>
          <a href="contact.html">
            <i class="fa-solid fa-message"></i>
            <span>CONTACT</span>
          </a>
        </div>
      </nav>
      <!-- End of Navbar -->

      <div class="auth-page">
        <div class="auth-card">
          <!-- Logo -->
          <div class="auth-logo">
            <i class="fa-solid fa-gamepad"></i>
            <span>GAME-HUB</span>
          </div>

          <!-- Tabs -->
          <div class="tab-row">
            <button type="button" class="auth-tab active" data-tab="login" onclick="switchTab('login')">LOGIN</button>
            <button type="button" class="auth-tab" data-tab="register" onclick="switchTab('register')">REGISTER</button>
          </div>

          <!-- Login Panel -->
          <div class="auth-panel active" id="login-panel">
            <form onsubmit="handleLogin(event)">
              <div class="auth-form-group">
                <label>Email Address</label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-envelope"></i>
                  <input type="email" placeholder="your@email.com" required />
                </div>
              </div>
              <div class="auth-form-group">
                <label>Password</label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-lock"></i>
                  <input type="password" placeholder="••••••••" required />
                </div>
                <a href="#" class="forgot-link">Forgot password?</a>
              </div>
              <button type="submit" class="auth-btn">LOGIN</button>
            </form>
            <div class="auth-divider">or</div>
            <button class="social-btn" onclick="alert('Social login coming soon!')">
              <i class="fa-brands fa-google" style="color:#DB4437;"></i> Continue with Google
            </button>
            <div class="auth-footer-text">
              Don't have an account? <a href="#" onclick="switchTab('register');return false;">Register here</a>
            </div>
          </div>

          <!-- Register Panel -->
          <div class="auth-panel" id="register-panel">
            <form onsubmit="handleRegister(event)">
              <div class="auth-name-row">
                <div class="auth-form-group">
                  <label>First Name</label>
                  <div class="auth-input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="John" required />
                  </div>
                </div>
                <div class="auth-form-group">
                  <label>Last Name</label>
                  <div class="auth-input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Doe" required />
                  </div>
                </div>
              </div>
              <div class="auth-form-group">
                <label>Email Address</label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-envelope"></i>
                  <input type="email" placeholder="your@email.com" required />
                </div>
              </div>
              <div class="auth-form-group">
                <label>Password</label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-lock"></i>
                  <input type="password" placeholder="••••••••" required />
                </div>
              </div>
              <div class="auth-form-group">
                <label>Confirm Password</label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-lock"></i>
                  <input type="password" placeholder="••••••••" required />
                </div>
              </div>
              <button type="submit" class="auth-btn">CREATE ACCOUNT</button>
            </form>
            <div class="auth-footer-text">
              Already have an account? <a href="#" onclick="switchTab('login');return false;">Login here</a>
            </div>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="copyright">
          <p class="copyright">&copy; <span id="current-year"></span> Website Coded by Tai Odunaiya</p>
        </div>
        <div class="brand">
          <i class="fa-solid fa-gamepad"></i>
          <h1>GAME-HUB</h1>
        </div>
      </footer>
    </div>
    <script>
      document.getElementById('current-year').textContent = new Date().getFullYear();

      function switchTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
        document.getElementById(tab + '-panel').classList.add('active');
        document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');
      }

      function handleLogin(e) {
        e.preventDefault();
        alert('Login successful! Welcome back.');
        window.location.href = 'index.html';
      }

      function handleRegister(e) {
        e.preventDefault();
        alert('Account created! Welcome to GAME-HUB.');
        window.location.href = 'index.html';
      }
    </script>
  </body>
</html>
