<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME-HUB | Cart</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kenia&family=Mukta:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
      .page-title-bar {
        width: 100%;
        background: #1e0772;
        padding: 4rem 10%;
      }
      .page-title-bar h1 {
        font-size: 5rem;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      .cart-main {
        padding: 5rem 10%;
        display: grid;
        grid-template-columns: 1fr 36rem;
        gap: 4rem;
        align-items: start;
      }
      .cart-items-section > .cart-empty {
        grid-column: 1 / -1;
      }
      .cart-empty {
        text-align: center;
        padding: 8rem 0;
      }
      .cart-empty i {
        font-size: 8rem;
        color: #ddd;
        display: block;
        margin-bottom: 2rem;
      }
      .cart-empty h2 {
        font-size: 3rem;
        color: #1e0772;
        margin-bottom: 1rem;
      }
      .cart-empty p {
        font-size: 1.7rem;
        color: #888;
        margin-bottom: 3rem;
      }
      .continue-btn {
        display: inline-block;
        padding: 1.2rem 3rem;
        background: #2848ff;
        color: #fff;
        border-radius: 3rem;
        font-size: 1.6rem;
        text-decoration: none;
        font-family: 'Mukta', sans-serif;
        transition: all 0.3s;
      }
      .continue-btn:hover {
        background: #1e0772;
      }
      .cart-items-section h2 {
        font-size: 2.5rem;
        color: #1e0772;
        padding-bottom: 1.5rem;
        border-bottom: 0.1rem solid #eee;
        margin-bottom: 2rem;
      }
      .cart-item {
        display: grid;
        grid-template-columns: 10rem 1fr auto auto;
        align-items: center;
        gap: 2rem;
        padding: 2rem 0;
        border-bottom: 0.1rem solid #f0f0f0;
      }
      .cart-item img {
        width: 10rem;
        height: 10rem;
        object-fit: contain;
        background: #f7f7f7;
        border-radius: 1rem;
        padding: 1rem;
      }
      .cart-item-info h3 {
        font-size: 1.8rem;
        color: #1e0772;
        font-weight: 400;
        margin-bottom: 0.5rem;
      }
      .cart-item-info p {
        font-size: 1.4rem;
        color: #888;
      }
      .qty-controls {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: #f7f7f7;
        padding: 0.5rem 1rem;
        border-radius: 3rem;
      }
      .qty-btn {
        width: 3rem;
        height: 3rem;
        border: none;
        background: #fff;
        border-radius: 50%;
        font-size: 1.8rem;
        color: #1e0772;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.1);
        transition: all 0.2s;
      }
      .qty-btn:hover {
        background: #2848ff;
        color: #fff;
      }
      .qty-num {
        font-size: 1.8rem;
        color: #1e0772;
        min-width: 2rem;
        text-align: center;
      }
      .item-price {
        font-size: 2rem;
        color: #1e0772;
        font-weight: 700;
        text-align: right;
      }
      .remove-btn {
        background: none;
        border: none;
        color: #ccc;
        font-size: 1.8rem;
        cursor: pointer;
        transition: color 0.2s;
        padding: 0.5rem;
      }
      .remove-btn:hover {
        color: #e74c3c;
      }
      .order-summary {
        background: #f7f7f7;
        border-radius: 2rem;
        padding: 3rem;
        position: sticky;
        top: 2rem;
      }
      .order-summary h2 {
        font-size: 2.5rem;
        color: #1e0772;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 0.1rem solid #eee;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        font-size: 1.7rem;
        color: #555;
        margin-bottom: 1.5rem;
      }
      .summary-row.total {
        font-size: 2.2rem;
        color: #1e0772;
        font-weight: 700;
        padding-top: 1.5rem;
        border-top: 0.1rem solid #ddd;
        margin-top: 1.5rem;
      }
      .checkout-btn {
        width: 100%;
        padding: 1.5rem;
        background: #2848ff;
        color: #fff;
        border: none;
        border-radius: 3rem;
        font-size: 1.8rem;
        cursor: pointer;
        font-family: 'Mukta', sans-serif;
        transition: all 0.3s;
        margin-top: 2rem;
        letter-spacing: 0.1rem;
      }
      .checkout-btn:hover {
        background: #1e0772;
      }
      .promo-row {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
      }
      .promo-row input {
        flex: 1;
        padding: 1rem 1.5rem;
        border: 0.1rem solid #ddd;
        border-radius: 3rem;
        font-size: 1.5rem;
        font-family: 'Mukta', sans-serif;
        color: #1e0772;
      }
      .promo-row input:focus {
        border-color: #2848ff;
      }
      .promo-btn {
        padding: 1rem 2rem;
        background: #1e0772;
        color: #fff;
        border: none;
        border-radius: 3rem;
        font-size: 1.5rem;
        cursor: pointer;
        font-family: 'Mukta', sans-serif;
        transition: all 0.3s;
      }
      .promo-btn:hover {
        background: #2848ff;
      }
      @media (max-width: 1000px) {
        .cart-main { padding: 5rem 5%; grid-template-columns: 1fr; }
        .page-title-bar { padding: 4rem 5%; }
        .order-summary { position: static; }
      }
      @media (max-width: 600px) {
        .cart-main { padding: 4rem 3%; }
        .page-title-bar { padding: 3rem 3%; }
        .page-title-bar h1 { font-size: 3.5rem; }
        .cart-item { grid-template-columns: 7rem 1fr; }
        .qty-controls, .item-price { grid-column: 2; }
        .remove-btn { grid-column: 1; grid-row: 1; justify-self: end; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="navbar-top">
          <a href="index.html" class="logo">
            <i class="fa-solid fa-gamepad"></i>
            <span>GAME-HUB</span>
          </a>
          <div class="search-bar">
            <input type="text" placeholder="What are you looking for?" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <div class="user">
            <a href="cart.html" class="cart-link" style="color:#2848ff;">
              <i class="fa-solid fa-cart-shopping"></i>
              <span>$0.00</span>
            </a>
            <a href="wishlist.html"><i class="fa-regular fa-heart"></i></a>
            <a href="login.html"><i class="fa-solid fa-user"></i></a>
          </div>
        </div>
        <div class="nav-list">
          <a href="index.html">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
          </a>
          <a href="products.html">
            <i class="fa-solid fa-gamepad"></i>
            <span>PRODUCTS</span>
          </a>
          <a href="index.html#pricing">
            <i class="fa-solid fa-dollar-sign"></i>
            <span>PRICING</span>
          </a>
          <a href="blog.html">
            <i class="fa-brands fa-blogger"></i>
            <span>BLOG</span>
          </a>
          <a href="sales.html">
            <i class="fa-solid fa-star"></i>
            <span>SALES</span>
          </a>
          <a href="contact.html">
            <i class="fa-solid fa-message"></i>
            <span>CONTACT</span>
          </a>
        </div>
      </nav>
      <!-- End of Navbar -->

      <div class="page-title-bar">
        <h1><i class="fa-solid fa-cart-shopping"></i> Shopping Cart</h1>
      </div>

      <div class="cart-main">
        <!-- Cart Items -->
        <div class="cart-items-section">
          <h2>Your Items</h2>

          <div class="cart-item">
            <img src="images/pricing-chair.png" alt="Game Chair" />
            <div class="cart-item-info">
              <h3>GAME CHAIR</h3>
              <p>Blue / Standard</p>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(this, -1)">−</button>
              <span class="qty-num">1</span>
              <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
            </div>
            <div>
              <p class="item-price">$169.00</p>
              <button class="remove-btn" onclick="removeItem(this)" title="Remove"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>

          <div class="cart-item">
            <img src="images/pricing-speakers.png" alt="Speakers" />
            <div class="cart-item-info">
              <h3>SPEAKERS</h3>
              <p>Black / Pair</p>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(this, -1)">−</button>
              <span class="qty-num">1</span>
              <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
            </div>
            <div>
              <p class="item-price">$199.00</p>
              <button class="remove-btn" onclick="removeItem(this)" title="Remove"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>

        </div>

        <!-- Order Summary -->
        <div class="order-summary">
          <h2>Order Summary</h2>
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">$368.00</span></div>
          <div class="summary-row"><span>Tax (8%)</span><span id="tax">$29.00</span></div>
          <div class="summary-row"><span>Shipping</span><span>Free</span></div>
          <div class="summary-row total"><span>Total</span><span id="total">$397.00</span></div>
          <div class="promo-row">
            <input type="text" placeholder="Promo code..." />
            <button class="promo-btn">Apply</button>
          </div>
          <button class="checkout-btn" onclick="alert('Checkout coming soon!')">PROCEED TO CHECKOUT</button>
          <p style="text-align:center;font-size:1.4rem;color:#888;margin-top:1.5rem;">
            <a href="products.html" style="color:#2848ff;text-decoration:none;">← Continue Shopping</a>
          </p>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="copyright">
          <p class="copyright">&copy; <span id="current-year"></span> Website Coded by Tai Odunaiya</p>
        </div>
        <div class="brand">
          <i class="fa-solid fa-gamepad"></i>
          <h1>GAME-HUB</h1>
        </div>
      </footer>
    </div>
    <script>
      document.getElementById('current-year').textContent = new Date().getFullYear();

      function changeQty(btn, delta) {
        const qtyEl = btn.parentElement.querySelector('.qty-num');
        let qty = parseInt(qtyEl.textContent) + delta;
        if (qty < 1) qty = 1;
        qtyEl.textContent = qty;
      }

      function removeItem(btn) {
        btn.closest('.cart-item').remove();
        const remaining = document.querySelectorAll('.cart-item');
        if (remaining.length === 0) {
          document.querySelector('.cart-items-section').innerHTML =
            '<div class="cart-empty">' +
            '<i class="fa-solid fa-cart-shopping"></i>' +
            '<h2>Your cart is empty</h2>' +
            '<p>Looks like you haven\'t added anything yet.</p>' +
            '<a href="products.html" class="continue-btn">BROWSE PRODUCTS</a>' +
            '</div>';
        }
      }
    </script>
  </body>
</html>
